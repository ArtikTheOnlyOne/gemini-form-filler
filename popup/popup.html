<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="popup.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="gff-popup">

        <div class="gff-header">
            <img src="../icons/gff128.png" alt="Gemini Form Filler" class="gff-logo" data-i18n-alt="popupHeaderTitle">
            <p class="gff-header-text" data-i18n="popupHeaderTitle">Gemini Form Filler</p>
        </div>

        <div class="gff-key-row">
            <input type="password" id="gff-api-key" class="gff-input gff-key-input" placeholder="Gemini API key" autocomplete="off" spellcheck="false" data-i18n-placeholder="apiKeyPlaceholder">
        </div>

        <div id="gff-model-row" class="gff-model-row">

            <p id="gff-status-text" class="gff-status-text"></p>

            <div class="gff-select-wrapper">
                <select id="gff-model-select" class="gff-select gff-model-select" hidden></select>
            </div>
        </div>

        <div class="gff-btn-row">
            <button id="gff-load-btn" class="gff-btn gff-load-btn" type="button" data-i18n="loadModelsButton">
                Load models
            </button>
        </div>

    </div>

    <script src="popup.js"></script>

</body>

</html>
