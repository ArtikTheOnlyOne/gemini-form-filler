name: Feature request
description: "Suggest an improvement or a new capability"
title: "[Feature]: "
labels: ["enhancement"]
body:
    - type: markdown
      attributes:
          value: |
              Have an early-stage idea, or want to talk it through first? Start a [discussion](https://github.com/ArtikTheOnlyOne/gemini-form-filler/discussions) instead.
    - type: textarea
      id: problem
      attributes:
          label: What problem would this solve?
          description: "Describe the situation where the extension falls short today."
      validations:
          required: true
    - type: textarea
      id: solution
      attributes:
          label: Proposed solution
          description: "What should the extension do?"
      validations:
          required: true
    - type: textarea
      id: alternatives
      attributes:
          label: Alternatives considered
    - type: dropdown
      id: area
      attributes:
          label: Area
          options:
              - Question types
              - Popup and settings
              - On-page interface
              - Rate limits and errors
              - Localization
              - Other
    - type: textarea
      id: context
      attributes:
          label: Additional context
    - type: checkboxes
      id: checks
      attributes:
          label: Before submitting
          options:
              - label: I searched the existing issues and discussions and found nothing similar
                required: true